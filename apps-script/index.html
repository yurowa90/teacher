<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<base target="_top" />
<style>
  :root { --brand:#3a5a40; --ink:#23211c; --muted:#6b665b; --line:#e3ddcf; --bg:#f7f5f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px;
    border-bottom:2px solid var(--brand); padding-bottom:10px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; color:var(--brand); }
  .email { font-size:12px; color:var(--muted); }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:#fff; padding:8px 12px; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
  button.danger { color:#b91c1c; border-color:#fca5a5; }
  button:disabled { opacity:.6; cursor:default; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1 1 auto; }
  input, textarea, select { font:inherit; width:100%; padding:8px 10px; border:1px solid #cbc7bd; border-radius:8px; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .badge { display:inline-block; background:#dfe7df; color:#1f3d2b; border-radius:999px; padding:1px 8px; font-size:12px; }
  .quote { border-left:4px solid #dfe7df; padding-left:10px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:14px; margin:6px 0; white-space:pre-wrap; }
  .msg.a { background:#fff; border:1px solid var(--line); }
  .msg.u { background:var(--brand); color:#fff; margin-left:auto; }
  .err { color:#b91c1c; font-size:13px; }
  .ok { color:#166534; font-size:13px; }
  .spin { color:var(--muted); font-size:13px; }
  .code { font-family:monospace; font-size:20px; letter-spacing:3px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 책갈피</h1>
    <span class="email" id="who">…</span>
  </header>
  <div id="app"><p class="spin">불러오는 중…</p></div>
</div>

<script>
// ── google.script.run 래퍼 ─────────────────────────────
function run(name) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
    r[name].apply(r, args);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
var app = document.getElementById('app');
var state = { classId:null, cls:null, tab:'books', chat:null };

// ── 초기화 ─────────────────────────────
run('getMe').then(function (m) {
  document.getElementById('who').textContent = m.identified ? m.email : '(계정 확인 필요)';
  if (!m.identified) {
    app.innerHTML = '<div class="card"><p class="err">구글 계정 정보를 읽지 못했습니다.</p><p class="muted">학교 구글 계정으로 로그인했는지 확인하세요. (개인 Gmail은 학교 도메인 밖이면 이메일이 안 읽힐 수 있어요.)</p></div>';
    return;
  }
  home();
}).catch(showErr);

function showErr(e) {
  app.innerHTML = '<div class="card"><p class="err">' + esc(e && e.message ? e.message : e) + '</p><button onclick="home()">홈으로</button></div>';
}

// ── 홈: 내 학급 ─────────────────────────────
function home() {
  state.classId = null; state.chat = null;
  app.innerHTML = '<p class="spin">학급 불러오는 중…</p>';
  run('getMyClasses').then(function (list) {
    var h = '<div class="row" style="margin-bottom:12px">' +
      '<button class="primary" onclick="doCreate()">학급 만들기</button>' +
      '<button onclick="doJoin()">학급 참여</button></div>';
    if (!list.length) {
      h += '<div class="card muted">아직 학급이 없습니다. 선생님은 “학급 만들기”, 학생은 “학급 참여”를 누르세요.</div>';
    } else {
      h += list.map(function (c) {
        return '<div class="card row"><div class="grow"><b>' + esc(c.name) + '</b> ' +
          (c.role !== 'student' ? '<span class="badge">교사</span>' : '') +
          (c.joinCode ? '<div class="muted">참여코드: <span class="code">' + esc(c.joinCode) + '</span></div>' : '') +
          '</div><button class="primary" onclick="openClass(\'' + c.id + '\')">열기</button></div>';
      }).join('');
    }
    app.innerHTML = h;
  }).catch(showErr);
}

function doCreate() {
  var name = prompt('학급 이름을 입력하세요 (예: 1학년 3반 독서)');
  if (!name) return;
  run('createClass', name).then(function (c) {
    alert('학급을 만들었습니다.\n참여코드: ' + c.joinCode + '\n(학생에게 이 코드를 알려주세요)');
    home();
  }).catch(function (e) { alert(e.message || e); });
}
function doJoin() {
  var code = prompt('참여코드 6자리를 입력하세요');
  if (!code) return;
  run('joinClass', code, '').then(function (r) {
    if (r.status === 'invalid') return alert('유효하지 않은 참여코드입니다.');
    if (r.status === 'already') { alert('이미 참여한 학급입니다.'); return openClass(r.classId); }
    openClass(r.classId);
  }).catch(function (e) { alert(e.message || e); });
}

// ── 학급 화면 ─────────────────────────────
function openClass(id) {
  state.classId = id; state.tab = 'books'; state.chat = null;
  app.innerHTML = '<p class="spin">불러오는 중…</p>';
  run('getClassInfo', id).then(function (c) { state.cls = c; renderClass(); }).catch(showErr);
}

function renderClass() {
  var c = state.cls;
  var h = '<button onclick="home()">← 내 학급</button>' +
    '<h2 style="margin:10px 0 4px">' + esc(c.name) + '</h2>';
  if (c.isTeacher) h += '<div class="muted">참여코드 <span class="code">' + esc(c.joinCode) + '</span> · 구성원 ' + c.members.length + '명 ' +
    '<button style="padding:2px 8px;font-size:12px" onclick="openSheet()">📊 스프레드시트 열기</button></div>';
  h += '<div class="tabs" style="margin-top:12px">' +
    tabBtn('books', '도서') + tabBtn('sentences', '문장 수집') + tabBtn('questions', '질문·토론') + '</div>' +
    '<div id="tab"></div>';
  app.innerHTML = h;
  renderTab();
}
function tabBtn(key, label) {
  return '<button class="' + (state.tab === key ? 'active' : '') + '" onclick="setTab(\'' + key + '\')">' + label + '</button>';
}
function setTab(t) { state.tab = t; renderClass(); }
function openSheet() {
  run('getSheetUrl', state.classId).then(function (url) { window.open(url, '_blank'); })
    .catch(function (e) { alert(e.message || e); });
}

function renderTab() {
  if (state.tab === 'books') return renderBooks();
  if (state.tab === 'sentences') return renderSentences();
  if (state.tab === 'questions') return renderQuestions();
}

// ── 도서 ─────────────────────────────
function renderBooks() {
  var box = document.getElementById('tab');
  box.innerHTML = '<p class="spin">불러오는 중…</p>';
  run('getBooks', state.classId).then(function (books) {
    var h = '';
    if (state.cls.isTeacher) {
      h += '<div class="card"><label>도서 등록</label>' +
        '<input id="bt" placeholder="제목" /><div style="height:6px"></div>' +
        '<input id="ba" placeholder="저자(선택)" /><div style="height:8px"></div>' +
        '<button class="primary" onclick="addBook()">등록</button><span id="bmsg" class="ok"></span></div>';
    }
    if (!books.length) h += '<div class="card muted">아직 등록된 도서가 없습니다.</div>';
    else h += books.map(function (b) {
      return '<div class="card row"><div class="grow"><b>' + esc(b.title) + '</b> <span class="muted">' + esc(b.author || '') + '</span></div>' +
        (state.cls.isTeacher ? '<button class="danger" onclick="delBook(\'' + b.id + '\',\'' + esc(b.title).replace(/'/g,"") + '\')">삭제</button>' : '') + '</div>';
    }).join('');
    box.innerHTML = h;
  }).catch(showErr);
}
function addBook() {
  var t = document.getElementById('bt').value, a = document.getElementById('ba').value;
  var msg = document.getElementById('bmsg'); msg.textContent = ' 등록 중…';
  run('addBook', state.classId, t, a).then(function () { renderBooks(); }).catch(function (e) { msg.textContent = ''; alert(e.message || e); });
}
function delBook(id, title) {
  if (!confirm('‘' + title + '’ 도서를 삭제할까요? 관련 문장도 함께 삭제됩니다.')) return;
  run('deleteBook', state.classId, id).then(function () { renderBooks(); }).catch(function (e) { alert(e.message || e); });
}

// ── 문장 수집 ─────────────────────────────
function renderSentences() {
  var box = document.getElementById('tab');
  box.innerHTML = '<p class="spin">불러오는 중…</p>';
  Promise.all([run('getBooks', state.classId), run('getSentences', state.classId)]).then(function (r) {
    var books = r[0], sentences = r[1];
    var h = '';
    // 교사·학생 모두 문장을 수집할 수 있다.
    if (!books.length) {
      h += '<div class="card muted">도서가 없어 문장을 수집할 수 없습니다. ' +
        (state.cls.isTeacher ? '먼저 “도서” 탭에서 도서를 등록하세요.' : '선생님께 도서 등록을 요청하세요.') + '</div>';
    } else {
      h += '<div class="card"><label>도서</label><select id="sb">' +
        books.map(function (b) { return '<option value="' + b.id + '">' + esc(b.title) + '</option>'; }).join('') + '</select>' +
        '<label>수집한 문장</label><textarea id="sq" rows="2"></textarea>' +
        '<label>쪽수/위치 (선택)</label><input id="sp" />' +
        '<label>이 문장을 고른 이유</label><textarea id="sr" rows="2"></textarea>' +
        '<label>자신의 해석</label><textarea id="si" rows="2"></textarea>' +
        '<label>떠오른 질문 (선택)</label><textarea id="sqq" rows="2"></textarea>' +
        '<label>태그 (선택, 쉼표 구분)</label><input id="st" placeholder="책임, 선택, 공동체" />' +
        '<div style="height:8px"></div><button class="primary" onclick="addSentence()">문장 저장</button> <span id="smsg" class="ok"></span></div>';
    }
    h += '<h3>' + (state.cls.isTeacher ? '문장 기록 (전체)' : '내 문장') + ' (' + sentences.length + ')</h3>';
    if (!sentences.length) h += '<div class="card muted">아직 수집한 문장이 없습니다.</div>';
    else h += sentences.map(function (s) {
      return '<div class="card"><div class="quote">“' + esc(s.quote) + '”</div>' +
        '<div class="muted" style="margin-top:4px">' + esc([s.bookTitle, s.page, s.author].filter(Boolean).join(' · ')) + '</div>' +
        '<div style="margin-top:6px"><b>이유</b> ' + esc(s.reason) + '</div>' +
        '<div><b>해석</b> ' + esc(s.interpretation) + '</div>' +
        (s.question ? '<div><b>질문</b> ' + esc(s.question) + '</div>' : '') +
        (s.tags ? '<div class="muted">#' + esc(s.tags).split(/[,\s]+/).filter(Boolean).join(' #') + '</div>' : '') +
        (s.mine ? '<div style="margin-top:6px"><button class="danger" onclick="delSentence(\'' + s.id + '\')">삭제</button></div>' : '') +
        '</div>';
    }).join('');
    box.innerHTML = h;
  }).catch(showErr);
}
function addSentence() {
  var data = {
    bookId: document.getElementById('sb').value, quote: document.getElementById('sq').value,
    page: document.getElementById('sp').value, reason: document.getElementById('sr').value,
    interpretation: document.getElementById('si').value, question: document.getElementById('sqq').value,
    tags: document.getElementById('st').value,
  };
  var msg = document.getElementById('smsg'); msg.textContent = ' 저장 중…';
  run('addSentence', state.classId, data).then(function () { renderSentences(); }).catch(function (e) { msg.textContent = ''; alert(e.message || e); });
}
function delSentence(id) {
  if (!confirm('이 문장을 삭제할까요?')) return;
  run('deleteSentence', state.classId, id).then(function () { renderSentences(); }).catch(function (e) { alert(e.message || e); });
}

// ── 질문·토론 (학생·교사가 질문을 올리고 서로 댓글로 토론) ─────────────
function renderQuestions() {
  var box = document.getElementById('tab');
  box.innerHTML = '<p class="spin">불러오는 중…</p>';
  Promise.all([run('getBooks', state.classId), run('getQuestions', state.classId)]).then(function (r) {
    var books = r[0], qs = r[1];
    var h = '<div class="card"><label>질문 만들기</label>' +
      '<select id="qb"><option value="">(도서 선택 안 함)</option>' +
        books.map(function (b) { return '<option value="' + b.id + '">' + esc(b.title) + '</option>'; }).join('') + '</select>' +
      '<textarea id="qq" rows="2" placeholder="친구들과 나누고 싶은 질문을 적어 보세요."></textarea>' +
      '<div style="height:8px"></div><button class="primary" onclick="addQuestion()">질문 올리기</button> <span id="qmsg" class="ok"></span></div>';
    h += '<h3>질문 (' + qs.length + ')</h3>';
    if (!qs.length) h += '<div class="card muted">아직 올라온 질문이 없습니다. 첫 질문을 올려 보세요.</div>';
    else h += qs.map(function (q) {
      return '<div class="card" id="q_' + q.id + '"><div>' + esc(q.question) + '</div>' +
        '<div class="muted" style="margin-top:4px">' + esc([q.bookTitle, q.author, q.createdAt].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="row" style="margin-top:6px">' +
          '<button onclick="toggleComments(\'' + q.id + '\')">💬 댓글 ' + q.commentCount + '</button>' +
          (q.mine || state.cls.isTeacher ? '<button class="danger" onclick="delQuestion(\'' + q.id + '\')">삭제</button>' : '') +
        '</div><div id="c_' + q.id + '" style="display:none;margin-top:8px"></div></div>';
    }).join('');
    box.innerHTML = h;
  }).catch(showErr);
}
function addQuestion() {
  var sel = document.getElementById('qb');
  var bookId = sel ? sel.value : '';
  var q = document.getElementById('qq').value;
  var msg = document.getElementById('qmsg'); msg.textContent = ' 올리는 중…';
  run('addQuestion', state.classId, { bookId: bookId, question: q })
    .then(function () { renderQuestions(); })
    .catch(function (e) { msg.textContent = ''; alert(e.message || e); });
}
function delQuestion(id) {
  if (!confirm('이 질문을 삭제할까요? 댓글도 함께 삭제됩니다.')) return;
  run('deleteQuestion', state.classId, id).then(function () { renderQuestions(); }).catch(function (e) { alert(e.message || e); });
}
var openComments = {};
function toggleComments(qid) {
  var box = document.getElementById('c_' + qid);
  if (openComments[qid]) { openComments[qid] = false; box.style.display = 'none'; return; }
  openComments[qid] = true; box.style.display = 'block';
  loadComments(qid);
}
function loadComments(qid) {
  var box = document.getElementById('c_' + qid);
  box.innerHTML = '<span class="spin">댓글 불러오는 중…</span>';
  run('getComments', state.classId, qid).then(function (cs) {
    var h = cs.map(function (c) {
      return '<div style="border-top:1px solid var(--line);padding:6px 0"><div>' + esc(c.body) + '</div>' +
        '<div class="muted">' + esc([c.author, c.createdAt].filter(Boolean).join(' · ')) + ' ' +
        (c.mine || state.cls.isTeacher ? '<button style="padding:1px 6px;font-size:12px" class="danger" onclick="delComment(\'' + qid + '\',\'' + c.id + '\')">삭제</button>' : '') +
        '</div></div>';
    }).join('');
    h += '<div class="row" style="margin-top:6px"><input id="ci_' + qid + '" class="grow" placeholder="댓글 달기" />' +
      '<button class="primary" onclick="sendComment(\'' + qid + '\')">등록</button></div>';
    box.innerHTML = h;
  }).catch(function (e) { box.innerHTML = '<span class="err">' + esc(e.message || e) + '</span>'; });
}
function sendComment(qid) {
  var inp = document.getElementById('ci_' + qid); var v = (inp.value || '').trim();
  if (!v) return;
  run('addComment', state.classId, qid, v).then(function () { loadComments(qid); bumpCount(qid, 1); }).catch(function (e) { alert(e.message || e); });
}
function delComment(qid, cid) {
  if (!confirm('댓글을 삭제할까요?')) return;
  run('deleteComment', state.classId, cid).then(function () { loadComments(qid); bumpCount(qid, -1); }).catch(function (e) { alert(e.message || e); });
}
function bumpCount(qid, delta) {
  var q = document.getElementById('q_' + qid);
  if (!q) return;
  var btn = q.querySelector('button[onclick^="toggleComments"]');
  if (btn) { var m = btn.textContent.match(/\d+/); var n = (m ? parseInt(m[0], 10) : 0) + delta; btn.textContent = '💬 댓글 ' + (n < 0 ? 0 : n); }
}
</script>
</body>
</html>
