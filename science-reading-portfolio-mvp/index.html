<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과학 독서·논술 포트폴리오 (Stage 1 MVP)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-title">
        <h1>과학 독서·논술 포트폴리오</h1>
        <p class="app-subtitle">성취기준 기반 · Stage 1 정적 MVP</p>
      </div>
      <nav class="mode-switch" aria-label="화면 전환">
        <button id="btn-student" class="mode-btn is-active" type="button">학생 화면</button>
        <button id="btn-teacher" class="mode-btn" type="button">교사 대시보드</button>
      </nav>
    </div>
    <div class="module-banner">
      <span class="module-banner__code">[10통과2-01-02]</span>
      <span class="module-banner__title">생명체의 구조는 '필요해서 생긴 것'인가, '선택되어 남은 것'인가?</span>
      <span class="module-banner__meta">통합과학2 · 변이 · 자연선택 · 진화 · 생물다양성</span>
    </div>
  </header>

  <main class="app-main">
    <!-- ================= 학생 화면 ================= -->
    <section id="student-view" class="view is-visible" aria-label="학생 활동 화면">
      <div class="toolbar">
        <label class="field">
          <span class="field__label">학생 익명 ID</span>
          <select id="student-select" class="field__control"></select>
        </label>
        <div class="toolbar__spacer"></div>
        <div id="student-progress" class="pill pill--info">진행률 —</div>
      </div>

      <div class="notice">
        <strong>안내</strong> · 실명·학번은 입력하지 않습니다. 입력한 내용은 이 브라우저에만 자동 저장됩니다.
      </div>

      <div id="activity-list" class="card-grid"></div>
    </section>

    <!-- ================= 교사 대시보드 ================= -->
    <section id="teacher-view" class="view" aria-label="교사 대시보드">
      <div class="toolbar">
        <h2 class="section-title">교사 대시보드</h2>
        <div class="toolbar__spacer"></div>
        <button id="btn-export-json" class="btn btn--ghost" type="button">JSON 내보내기</button>
        <button id="btn-export-csv" class="btn btn--ghost" type="button">CSV 내보내기</button>
      </div>

      <div id="metric-cards" class="metric-grid"></div>

      <h3 class="section-subtitle">학생별 진행 현황</h3>
      <div class="table-wrap">
        <table id="progress-table" class="data-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <h3 class="section-subtitle">오개념 빈도</h3>
      <div id="misconception-freq" class="freq-list"></div>

      <h3 class="section-subtitle">답안 검토 · 채점</h3>
      <div class="review-controls">
        <label class="field">
          <span class="field__label">학생</span>
          <select id="review-student" class="field__control"></select>
        </label>
        <label class="field">
          <span class="field__label">활동</span>
          <select id="review-activity" class="field__control"></select>
        </label>
        <button id="btn-load-review" class="btn btn--primary" type="button">불러오기</button>
      </div>
      <div id="review-panel" class="review-panel" hidden></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Stage 1 MVP · localStorage 전용 · 로그인/서버/AI 자동채점 없음 · 교사가 최종 평가자입니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
