<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>켄텍 6대 트랙 탐구 나침반 · KENTECH Track Explorer</title>
<meta name="description" content="한국에너지공과대학교(켄텍) 6대 트랙에 맞춰 탐구 주제·자료·질문·방법을 추천하는 학생용 웹앱" />
<style>
  /* =========================================================
     Part 2-a · 디자인 시스템 (CSS 변수/토큰)
     ========================================================= */
  :root{
    --bg:#0f1420; --bg-soft:#161d2e; --surface:#1c2436; --surface-2:#232d43;
    --line:#2c374f; --line-soft:#243049;
    --txt:#eaf0fb; --txt-dim:#a7b3ca; --txt-mute:#6f7d99;
    --brand:#31d0aa; --brand-2:#4ea8ff; --brand-3:#8b7bff;
    --accent:#ffd166; --danger:#ff6b7d;
    --radius:16px; --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --maxw:1040px;
    /* 면접평가 4역량 색상 */
    --c-problem:#4ea8ff; --c-thinking:#31d0aa; --c-creative:#ffb454; --c-comm:#c98bff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #1b2740 0, transparent 60%),
               radial-gradient(1000px 500px at -10% 10%, #17233a 0, transparent 55%),
               var(--bg);
    color:var(--txt);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--brand-2);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}

  /* ---- 헤더 ---- */
  header.site{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
    background:linear-gradient(180deg, rgba(15,20,32,.92), rgba(15,20,32,.72));
    border-bottom:1px solid var(--line-soft);
  }
  .site .wrap{display:flex;align-items:center;gap:14px;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
  .logo .mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04201a;box-shadow:var(--shadow)
  }
  .logo b{font-size:16px}
  .logo span{font-size:11.5px;color:var(--txt-mute);font-weight:600;display:block;margin-top:-3px}
  .site nav{margin-left:auto;display:flex;gap:6px}
  .navbtn{
    background:transparent;border:1px solid transparent;color:var(--txt-dim);
    padding:7px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap
  }
  .navbtn:hover{color:var(--txt);background:var(--surface)}
  .navbtn.active{color:var(--txt);background:var(--surface-2);border-color:var(--line)}
  .navbtn .cnt{
    display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;
    border-radius:9px;background:var(--brand);color:#04201a;font-size:11px;font-weight:800;vertical-align:1px
  }

  /* ---- 공통 컴포넌트 ---- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--txt);padding:10px 16px;border-radius:12px;
    cursor:pointer;font-weight:700;font-size:14px;transition:.15s
  }
  .btn:hover{border-color:var(--brand);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#04201a;border:none}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
    font-size:11.5px;font-weight:700;border:1px solid var(--line);color:var(--txt-dim);background:var(--bg-soft)
  }
  .sec-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--txt);display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .sec-title .ic{font-size:16px}
  .muted{color:var(--txt-dim)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* =========================================================
     화면1 · 홈(트랙 선택)
     ========================================================= */
  .hero{padding:40px 0 8px;text-align:center}
  .hero h1{font-size:clamp(26px,4.4vw,40px);line-height:1.2;margin:0 0 10px;letter-spacing:-.03em}
  .hero h1 .g{background:linear-gradient(120deg,var(--brand),var(--brand-2) 55%,var(--brand-3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--txt-dim);max-width:640px;margin:0 auto;font-size:15.5px}
  .hero .steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .hero .steps .s{font-size:12.5px;color:var(--txt-mute);background:var(--bg-soft);border:1px solid var(--line-soft);padding:6px 12px;border-radius:999px}
  .hero .steps .s b{color:var(--brand)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0 10px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
  .track-card{
    position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(180deg,var(--surface),var(--bg-soft));padding:20px 18px 18px;cursor:pointer;
    transition:.18s;overflow:hidden
  }
  .track-card:hover{transform:translateY(-4px);border-color:var(--tc,var(--brand))}
  .track-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .track-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc,var(--brand))}
  .track-card .ic{font-size:30px;line-height:1;margin-bottom:10px;display:block}
  .track-card h3{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
  .track-card .en{font-size:11px;color:var(--txt-mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .track-card .tag{margin-top:10px;font-size:13px;color:var(--txt-dim);min-height:38px}
  .track-card .kw{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .track-card .kw span{font-size:11px;color:var(--txt-mute);background:var(--surface-2);border:1px solid var(--line-soft);padding:2px 8px;border-radius:7px}
  .track-card .go{margin-top:14px;font-size:13px;font-weight:800;color:var(--tc,var(--brand));display:flex;align-items:center;gap:6px}

  /* ---- 홈 하단: 역량 안내 ---- */
  .insight{
    margin:34px 0 50px;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(180deg,var(--bg-soft),var(--surface));padding:22px
  }
  .insight h2{font-size:16px;margin:0 0 6px}
  .insight .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  @media(max-width:720px){.insight .cgrid{grid-template-columns:repeat(2,1fr)}}
  .cbox{border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px;background:var(--surface)}
  .cbox .h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px}
  .cbox .dot{width:9px;height:9px;border-radius:50%}
  .cbox p{margin:6px 0 0;font-size:12px;color:var(--txt-dim);line-height:1.5}

  /* =========================================================
     화면2 · 트랙 상세
     ========================================================= */
  .backbar{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
  .detail-head{
    border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;
    background:linear-gradient(135deg,var(--surface),var(--bg-soft));position:relative;overflow:hidden
  }
  .detail-head::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--tc);opacity:.12;filter:blur(10px)}
  .detail-head .ic{font-size:40px}
  .detail-head h2{margin:8px 0 2px;font-size:26px;letter-spacing:-.03em}
  .detail-head .en{font-size:12px;color:var(--txt-mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .detail-head .desc{margin:12px 0 0;color:var(--txt-dim);font-size:15px;max-width:760px}
  .detail-head .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .detail-head .meta .pill.k{border-color:var(--tc);color:var(--txt)}

  .tabs{display:flex;gap:4px;border:1px solid var(--line);background:var(--bg-soft);padding:5px;border-radius:14px;margin-bottom:18px;position:sticky;top:70px;z-index:20}
  .tab{flex:1;text-align:center;padding:9px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--txt-dim);border:none;background:transparent;transition:.15s}
  .tab:hover{color:var(--txt)}
  .tab.active{background:var(--surface-2);color:var(--txt);box-shadow:var(--shadow)}
  @media(max-width:560px){.tab{font-size:12px;padding:8px 4px}.tab .t-full{display:none}}

  .panel{display:none}
  .panel.active{display:block;animation:fade .3s ease}

  /* 자료 카드 */
  .res{border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:11px;background:var(--surface);transition:.15s}
  .res:hover{border-color:var(--brand-2)}
  .res .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .res h4{margin:0;font-size:15px}
  .res h4 a{color:var(--txt)}
  .res .sum{font-size:13px;color:var(--txt-dim);margin:4px 0 8px}
  .res .src{font-size:12px;color:var(--txt-mute)}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px;letter-spacing:.02em}
  .b-국내{background:rgba(78,168,255,.15);color:#8cc6ff;border:1px solid rgba(78,168,255,.3)}
  .b-해외{background:rgba(49,208,170,.15);color:#6ee7c8;border:1px solid rgba(49,208,170,.3)}
  .b-논문{background:rgba(199,139,255,.15);color:#d6b3ff;border:1px solid rgba(199,139,255,.3)}
  .b-기관{background:rgba(255,209,102,.15);color:#ffdf94;border:1px solid rgba(255,209,102,.3)}

  /* 질문/방법 카드 */
  .qcard,.mcard{border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:11px;background:var(--surface)}
  .qcard .qtop{display:flex;align-items:flex-start;gap:10px}
  .qcard .qnum{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--txt-dim)}
  .qcard .qtext{font-size:15px;font-weight:600;flex:1}
  .lvl{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px}
  .lvl-기초{background:rgba(49,208,170,.15);color:#6ee7c8;border:1px solid rgba(49,208,170,.3)}
  .lvl-심화{background:rgba(78,168,255,.15);color:#8cc6ff;border:1px solid rgba(78,168,255,.3)}
  .lvl-융합{background:rgba(199,139,255,.15);color:#d6b3ff;border:1px solid rgba(199,139,255,.3)}
  .comps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .comp{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .comp .dot{width:7px;height:7px;border-radius:50%}
  .qcard .qact,.mcard .mact{margin-top:12px;display:flex;gap:8px;align-items:center}
  .mcard h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
  .mcard .mdesc{font-size:13.5px;color:var(--txt-dim);margin:0 0 8px}
  .mcard .tools{display:flex;flex-wrap:wrap;gap:6px}
  .mcard .tools span{font-size:11px;color:var(--txt-mute);background:var(--surface-2);border:1px solid var(--line-soft);padding:2px 8px;border-radius:7px}
  .added{color:var(--brand);font-size:12.5px;font-weight:800;display:none;align-items:center;gap:5px}
  .added.on{display:inline-flex}

  /* filter bar */
  .filterbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
  .filterbar .lab{font-size:12px;color:var(--txt-mute);font-weight:700;margin-right:2px}
  .fbtn{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg-soft);color:var(--txt-dim);cursor:pointer;transition:.15s}
  .fbtn:hover{color:var(--txt)}
  .fbtn.on{background:var(--surface-2);color:var(--txt);border-color:var(--brand)}

  /* =========================================================
     화면3 · 나의 탐구 설계서
     ========================================================= */
  .plan-head{padding:22px 0 6px}
  .plan-head h2{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .plan-empty{border:1px dashed var(--line);border-radius:var(--radius);padding:48px 20px;text-align:center;color:var(--txt-dim)}
  .plan-empty .ic{font-size:44px;display:block;margin-bottom:12px;opacity:.7}
  .plan-group{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;background:var(--surface)}
  .plan-group > h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:9px}
  .plan-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-soft)}
  .plan-item:first-of-type{border-top:none}
  .plan-item .body{flex:1}
  .plan-item .body .t{font-weight:600;font-size:14.5px}
  .plan-item .body .s{font-size:12.5px;color:var(--txt-mute);margin-top:3px}
  .xbtn{background:transparent;border:1px solid var(--line);color:var(--txt-mute);width:28px;height:28px;border-radius:8px;cursor:pointer;flex:0 0 auto}
  .xbtn:hover{border-color:var(--danger);color:var(--danger)}
  .comp-summary{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;background:linear-gradient(180deg,var(--bg-soft),var(--surface))}
  .meter{margin:10px 0}
  .meter .ml{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .meter .bar{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .meter .bar i{display:block;height:100%;border-radius:6px;transition:width .5s ease}
  .plan-actions{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 40px}

  footer.site{border-top:1px solid var(--line-soft);padding:26px 0;margin-top:20px;color:var(--txt-mute);font-size:12.5px}
  footer.site .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface-2);border:1px solid var(--brand);color:var(--txt);padding:11px 18px;border-radius:12px;
    font-weight:700;font-size:13.5px;box-shadow:var(--shadow);transition:.25s;z-index:100;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:560px){
    .site .wrap{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;gap:8px}
    .logo b{font-size:13.5px;line-height:1.2}
    .logo span{display:none}
    .logo .mark{width:30px;height:30px;font-size:16px}
    .site nav{gap:4px}
    .navbtn{padding:6px 9px;font-size:12.5px}
    .hero{padding-top:26px}
    .tabs{top:64px}
  }
  @media print{
    header.site,footer.site,.tabs,.plan-actions,.navbtn,.backbar{display:none!important}
    body{background:#fff;color:#000}
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="logo">
      <div class="mark">⚡</div>
      <div>
        <b>켄텍 6대 트랙 탐구 나침반</b>
        <span>KENTECH Track Explorer · 탐구주제 추천</span>
      </div>
    </div>
    <nav id="nav">
      <button class="navbtn active" data-nav="home">트랙 탐색</button>
      <button class="navbtn" data-nav="plan">나의 탐구 설계서<span class="cnt" id="planCnt" style="display:none">0</span></button>
    </nav>
  </div>
</header>

<main id="app" class="wrap" role="main"></main>

<footer class="site">
  <div class="wrap">
    <span>켄텍 6대 트랙 탐구 나침반 · 학생 탐구활동/세특 설계 도우미</span>
    <span>자료 출처는 각 항목의 링크를 확인하세요 · 제시 자료는 예시이며 방문 시점에 따라 달라질 수 있습니다.</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   Part 1 · 데이터 레이어
   -------------------------------------------------------------------------
   COMP : 면접평가 4역량 (사진2 인사이트)  →  탐구활동 태깅용
   ATC  : ATC21s 21세기 필수역량 (사진1)   →  홈 안내/설계서 프레이밍
   TRACKS : 켄텍 학부 6대 트랙 (편집 용이하게 배열로 관리)
   ========================================================================= */

  // 면접평가 4대 평가역량 (이미지: 면접의 설계 및 방향)
  const COMP = {
    problem : { label:"문제해결능력", color:"var(--c-problem)",  desc:"원인 분석과 다양한 접근·통찰적 사고로 문제를 처리" },
    thinking: { label:"사고력",       color:"var(--c-thinking)", desc:"문제를 접근·해결하는 데 필요한 기본 사고력" },
    creative: { label:"창의성",       color:"var(--c-creative)", desc:"고정관념·편견을 벗어난 유연한 사고" },
    comm    : { label:"의사소통능력", color:"var(--c-comm)",     desc:"공동체 안에서 생각과 의견을 교환하는 능력" }
  };

  // ATC21s 21세기 필수역량 (이미지: 사고방식/작업도구/작업방식/삶의방식)
  const ATC = [
    { key:"think", label:"사고 방식", color:"#4ea8ff", desc:"창의·비판적 사고, 문제해결, 메타인지" },
    { key:"tool",  label:"작업 도구", color:"#ffb454", desc:"정보 리터러시, 디지털·데이터 도구 활용" },
    { key:"work",  label:"작업 방식", color:"#c98bff", desc:"의사소통, 협업(팀워크)" },
    { key:"live",  label:"삶의 방식", color:"#31d0aa", desc:"지역·글로벌 시민의식, 삶과 진로 연계" }
  ];

  // 켄텍 학부 6대 트랙
  const TRACKS = [
    {
      id:"battery", name:"차세대전지", en:"Next-Generation Battery", icon:"🔋", color:"#4ea8ff",
      tagline:"전고체·리튬황·나트륨 등 더 안전하고 오래가는 배터리를 설계한다.",
      keywords:["전고체 배터리","리튬황","나트륨전지","에너지밀도","ESS"],
      careers:["이차전지 소재·셀 연구","전기차/ESS 산업","배터리 안전·진단"],
      desc:"차세대전지 트랙은 리튬이온을 넘어서는 전지 시스템을 다룹니다. 원가 절감·에너지밀도 향상·안전성이라는 세 축을 놓고, 전고체 전해질·리튬황·나트륨전지 같은 새로운 화학을 탐구합니다. 전극–전해질 계면, 열 안정성, 수명(충·방전 사이클)이 핵심 연구 주제입니다.",

  const state = {
    screen : "home",     // 'home' | 'track' | 'plan'
    trackId: null,
    tab    : "desc",     // 'desc' | 'res' | 'q' | 'method'
    levelFilter: "all",  // 'all' | '기초' | '심화' | '융합'
    plan   : { questions:[], methods:[] }  // {trackId, ...}
  };

  const app = document.getElementById("app");
  const $ = (sel, root=document) => root.querySelector(sel);
  const trackById = id => TRACKS.find(t => t.id === id);
  const trackName = id => (trackById(id) || {}).name || "기타";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- 설계서 자동 저장/복원 (localStorage) ----
  const LS_KEY = "kentech-plan-v1";
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.plan)); }catch(e){} }
  function restore(){
    try{
      const raw = localStorage.getItem(LS_KEY); if(!raw) return;
      const p = JSON.parse(raw);
      if(!p || !Array.isArray(p.questions) || !Array.isArray(p.methods)) return;
      // 데이터가 바뀌어 사라진 트랙 항목은 걸러서 복원 (오류 방지)
      state.plan.questions = p.questions.filter(q => q && trackById(q.trackId) && Array.isArray(q.comps));
      state.plan.methods   = p.methods.filter(m => m && trackById(m.trackId));
    }catch(e){}
  }

  function go(screen, opts={}){
    state.screen = screen;
    if(opts.trackId !== undefined) state.trackId = opts.trackId;
    if(screen === "track") state.tab = "desc";
    window.scrollTo({top:0, behavior:"instant"});
    render();
  }

/* =========================================================================

   ========================================================================= */
  function render(){
    // 내비 활성화 + 카운트
    document.querySelectorAll("[data-nav]").forEach(b=>{
      b.classList.toggle("active",
        (b.dataset.nav==="home" && state.screen!=="plan") ||
        (b.dataset.nav==="plan" && state.screen==="plan"));
    });
    const cnt = state.plan.questions.length + state.plan.methods.length;
    const cntEl = document.getElementById("planCnt");
    cntEl.textContent = cnt; cntEl.style.display = cnt ? "inline-grid" : "none";
    persist();

    if(state.screen==="home")  app.innerHTML = viewHome();
    else if(state.screen==="track") app.innerHTML = viewTrack(trackById(state.trackId));
    else app.innerHTML = viewPlan();
  }

  function compBadges(keys){
    return keys.map(k=>{
      const c = COMP[k]; if(!c) return "";
      return `<span class="comp" style="background:${hexA(c.color)};color:${c.color}">
        <span class="dot" style="background:${c.color}"></span>${esc(c.label)}</span>`;
    }).join("");
  }
  // 역량 배지의 옅은 배경색 (CSS 변수 → 실제 hex 매핑 후 알파 적용)
  const COLORHEX = {"var(--c-problem)":"#4ea8ff","var(--c-thinking)":"#31d0aa","var(--c-creative)":"#ffb454","var(--c-comm)":"#c98bff"};
  function hexA(v){ return rgbaFrom(COLORHEX[v] || v, 0.14); }
  function rgbaFrom(hex,a){ const n=hex.replace("#",""); const r=parseInt(n.substr(0,2),16),g=parseInt(n.substr(2,2),16),b=parseInt(n.substr(4,2),16); return `rgba(${r},${g},${b},${a})`; }

  function viewTrack(t){
    if(!t) { go("home"); return ""; }

    // 자료 탭
    const resHtml = t.resources.map(r=>`
      <div class="res">
        <div class="top">
          <span class="badge b-${r.type}">${r.type}</span>
          <h4><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a></h4>
        </div>
        <div class="sum">${esc(r.sum)}</div>
        <div class="src">📄 ${esc(r.src)}</div>
      </div>`).join("");

    // 질문 탭 (레벨 필터 적용)
    const qs = t.questions.filter(q=> state.levelFilter==="all" || q.level===state.levelFilter);
    const qHtml = qs.map(q=>{
      const idx = t.questions.indexOf(q);
      const key = t.id+"-"+idx;
      const added = state.plan.questions.some(p=>p.key===key);
      return `
      <div class="qcard">
        <div class="qtop">
          <div class="qnum">${idx+1}</div>
          <div class="qtext">${esc(q.text)}</div>
          <span class="lvl lvl-${q.level}">${q.level}</span>
        </div>
        <div class="comps">${compBadges(q.comps)}</div>
        <div class="qact">
          <button class="btn sm ${added?'ghost':'primary'}" data-addq="${key}">${added?'✓ 담김':'＋ 설계서에 담기'}</button>
        </div>
      </div>`;
    }).join("") || `<p class="muted">해당 난이도의 질문이 없습니다.</p>`;

    // 방법 탭
    const mHtml = t.methods.map((m,idx)=>{
      const key = t.id+"-m"+idx;
      const added = state.plan.methods.some(p=>p.key===key);
      return `
      <div class="mcard">
        <h4>🧪 ${esc(m.title)}</h4>
        <div class="mdesc">${esc(m.desc)}</div>
        <div class="tools">${m.tools.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
        <div class="mact">
          <button class="btn sm ${added?'ghost':'primary'}" data-addm="${key}">${added?'✓ 담김':'＋ 설계서에 담기'}</button>
        </div>
      </div>`;
    }).join("");

    const tab = (id,label,full)=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}<span class="t-full">${full||''}</span></button>`;

    return `
    <div class="backbar fade">
      <button class="btn ghost sm" data-nav="home">← 트랙 목록</button>
      <span class="muted" style="font-size:13px">6대 트랙 중 <b style="color:${t.color}">${esc(t.name)}</b></span>
    </div>

    <section class="detail-head fade" style="--tc:${t.color}">
      <span class="ic">${t.icon}</span>
      <div class="en">${esc(t.en)}</div>
      <h2>${esc(t.name)}</h2>
      <div class="desc">${esc(t.desc)}</div>
      <div class="meta">
        ${t.keywords.map(k=>`<span class="pill k">#${esc(k)}</span>`).join("")}
      </div>
      <div class="meta">
        <span class="muted" style="font-size:12.5px">🎓 진로: ${t.careers.map(esc).join(" · ")}</span>
      </div>
    </section>

    <div class="tabs fade">
      ${tab("desc","설명","")}
      ${tab("res","자료 <span style='opacity:.6'>"+t.resources.length+"</span>","")}
      ${tab("q","질문 <span style='opacity:.6'>"+t.questions.length+"</span>","")}
      ${tab("method","방법 <span style='opacity:.6'>"+t.methods.length+"</span>","")}
    </div>

    <div class="panel ${state.tab==='desc'?'active':''}" id="p-desc">
      <div class="sec-title"><span class="ic">📘</span> 트랙 한눈에 보기</div>
      <div class="res"><div class="sum" style="font-size:14.5px;color:var(--txt)">${esc(t.desc)}</div></div>
      <div class="sec-title" style="margin-top:20px"><span class="ic">🧭</span> 이렇게 탐구를 이어가세요</div>
      <div class="res"><div class="sum" style="font-size:14px">
        ① <b>자료</b> 탭에서 국내외 칼럼·연구자료로 배경지식을 쌓고 →
        ② <b>질문</b> 탭에서 관심 가는 탐구 질문을 고른 뒤 →
        ③ <b>방법</b> 탭에서 실제 탐구 방법을 담으면 →
        <b>나의 탐구 설계서</b>가 자동으로 정리됩니다.
      </div></div>
    </div>

    <div class="panel ${state.tab==='res'?'active':''}" id="p-res">
      <div class="sec-title"><span class="ic">🔎</span> 국내외 칼럼 · 연구자료</div>
      ${resHtml}
    </div>

    <div class="panel ${state.tab==='q'?'active':''}" id="p-q">
      <div class="sec-title"><span class="ic">❓</span> 탐구 질문 <span class="muted" style="font-weight:600">— 난이도로 걸러보세요</span></div>
      <div class="filterbar">
        <span class="lab">난이도</span>
        ${["all","기초","심화","융합"].map(l=>`<button class="fbtn ${state.levelFilter===l?'on':''}" data-lvl="${l}">${l==="all"?"전체":l}</button>`).join("")}
      </div>
      ${qHtml}
    </div>

    <div class="panel ${state.tab==='method'?'active':''}" id="p-method">
      <div class="sec-title"><span class="ic">🧪</span> 탐구 방법 · 도구</div>
      ${mHtml}
    </div>`;
  }

  /* ---- 화면3: 나의 탐구 설계서 ---- */
  function viewPlan(){
    const { questions, methods } = state.plan;
    if(questions.length===0 && methods.length===0){
      return `
      <div class="plan-head fade"><h2>🧭 나의 탐구 설계서</h2>
        <p class="muted">고른 탐구 질문과 방법이 여기에 모입니다.</p></div>
      <div class="plan-empty fade">
        <span class="ic">📭</span>
        아직 담은 항목이 없어요.<br/>트랙을 골라 마음에 드는 <b>질문</b>과 <b>방법</b>을 담아보세요.
        <div style="margin-top:18px"><button class="btn primary" data-nav="home">트랙 탐색하러 가기</button></div>
      </div>`;
    }

    // 역량 집계
    const tally = {problem:0,thinking:0,creative:0,comm:0};
    questions.forEach(q=> q.comps.forEach(c=> tally[c]!==undefined && tally[c]++));
    const maxV = Math.max(1, ...Object.values(tally));
    const meters = Object.keys(COMP).map(k=>{
      const v = tally[k], c = COMP[k];
      return `<div class="meter">
        <div class="ml"><span style="color:${c.color}">${esc(c.label)}</span><span class="muted">${v}회</span></div>
        <div class="bar"><i style="width:${(v/maxV)*100}%;background:${c.color}"></i></div>
      </div>`;
    }).join("");

    const qItems = questions.map(q=>`
      <div class="plan-item">
        <div class="body">
          <div class="t">${esc(q.text)}</div>
          <div class="s">${esc(trackName(q.trackId))} · <span class="lvl lvl-${q.level}" style="padding:1px 6px">${q.level}</span></div>
        </div>
        <button class="xbtn" data-delq="${q.key}" aria-label="삭제">✕</button>
      </div>`).join("");

    const mItems = methods.map(m=>`
      <div class="plan-item">
        <div class="body">
          <div class="t">${esc(m.title)}</div>
          <div class="s">${esc(trackName(m.trackId))} · ${esc(m.desc)}</div>
        </div>
        <button class="xbtn" data-delm="${m.key}" aria-label="삭제">✕</button>
      </div>`).join("");

    return `
    <div class="plan-head fade"><h2>🧭 나의 탐구 설계서</h2>
      <p class="muted">고른 질문·방법과, 이 탐구가 길러줄 역량을 한눈에 정리했어요.</p></div>

    <div class="comp-summary fade">
      <div class="sec-title"><span class="ic">📊</span> 이 탐구가 길러주는 역량 (면접 4대 평가역량 기준)</div>
      ${meters}
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">※ 켄텍·이공계 면접은 문제해결능력·사고력·창의성·의사소통능력을 봅니다. 위 분포가 고르게 채워지도록 질문·방법을 조합해 보세요.</p>
    </div>

    ${questions.length?`<div class="plan-group fade"><h3>❓ 담은 탐구 질문 <span class="muted">(${questions.length})</span></h3>${qItems}</div>`:''}
    ${methods.length?`<div class="plan-group fade"><h3>🧪 담은 탐구 방법 <span class="muted">(${methods.length})</span></h3>${mItems}</div>`:''}

    <div class="plan-actions fade">
      <button class="btn primary" data-copy="1">📋 설계서 복사</button>
      <button class="btn" data-print="1">🖨️ 인쇄 / PDF</button>
      <button class="btn ghost" data-nav="home">＋ 트랙 더 탐색</button>
      <button class="btn ghost" data-clear="1" style="margin-left:auto">전체 비우기</button>
    </div>`;
  }

/* =========================================================================
   Part 4 · 상호작용 (이벤트 위임)
   ========================================================================= */
  function addQuestion(key){
    const [tid, idx] = key.split("-");
    const t = trackById(tid); const q = t.questions[+idx];
    if(state.plan.questions.some(p=>p.key===key)) return;
    state.plan.questions.push({ key, trackId:tid, text:q.text, level:q.level, comps:q.comps });
    toast("설계서에 담았어요 ✓"); render();
  }
  function addMethod(key){
    const idx = +key.split("-m")[1];
    const tid = key.split("-m")[0];
    const t = trackById(tid); const m = t.methods[idx];
    if(state.plan.methods.some(p=>p.key===key)) return;
    state.plan.methods.push({ key, trackId:tid, title:m.title, desc:m.desc });
    toast("설계서에 담았어요 ✓"); render();
  }

  function planToText(){
    let out = "【 나의 탐구 설계서 · 켄텍 6대 트랙 】\n\n";
    if(state.plan.questions.length){
      out += "■ 탐구 질문\n";
      state.plan.questions.forEach((q,i)=> out += `${i+1}. (${trackName(q.trackId)}/${q.level}) ${q.text}\n`);
      out += "\n";
    }
    if(state.plan.methods.length){
      out += "■ 탐구 방법\n";
      state.plan.methods.forEach((m,i)=> out += `${i+1}. (${trackName(m.trackId)}) ${m.title} — ${m.desc}\n`);
    }
    return out;
  }

  document.addEventListener("click", e=>{
    const el = e.target.closest("[data-nav],[data-open],[data-tab],[data-lvl],[data-addq],[data-addm],[data-delq],[data-delm],[data-copy],[data-print],[data-clear]");
    if(!el) return;
    const d = el.dataset;
    if(d.nav)   go(d.nav==="home" ? "home" : "plan");
    else if(d.open) go("track", {trackId:d.open});
    else if(d.tab)  { state.tab = d.tab; render(); }
    else if(d.lvl)  { state.levelFilter = d.lvl; render(); }
    else if(d.addq) addQuestion(d.addq);
    else if(d.addm) addMethod(d.addm);
    else if(d.delq) { state.plan.questions = state.plan.questions.filter(p=>p.key!==d.delq); render(); }
    else if(d.delm) { state.plan.methods   = state.plan.methods.filter(p=>p.key!==d.delm); render(); }
    else if(d.copy) { navigator.clipboard?.writeText(planToText()).then(()=>toast("복사했어요 📋")).catch(()=>toast("복사 실패 — 길게 눌러 복사하세요")); }
    else if(d.print) window.print();
    else if(d.clear){ if(confirm("담은 항목을 모두 비울까요?")){ state.plan={questions:[],methods:[]}; render(); } }
  });

  let toastTimer;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("on"), 1800);
  }

/* =========================================================================
   Part 2-b · 초기화
   ========================================================================= */
  restore();   // 저장된 설계서 복원 (있으면)
  render();
</script>
</body>
</html>
