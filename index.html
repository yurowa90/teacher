<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>논술형 평가 문항 설계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ── 화면 UI: 저휘도 잉크 블루를 쓰는 에디토리얼 워크스페이스 ── */
  :root{
    --ui-bg:#D5DBE3; --ui-surface:#E9EDF2; --ui-surface-subtle:#DDE3EA;
    --ui-canvas:#C8D0DA; --ui-paper:#F6F3EB;
    --ui-text:#152238; --ui-text-secondary:#526072;
    --ui-border:#B6C0CD; --ui-border-strong:#8F9DAF;
    --ui-primary:#2859B6; --ui-primary-hover:#1E478F; --ui-primary-soft:#D5E0F2;
    --ui-accent:var(--ui-primary); --ui-accent-soft:var(--ui-primary-soft);
    --ui-success:#2F6B55; --ui-success-soft:#E1ECE7;
    --ui-warning:#7C5B21; --ui-warning-soft:#F1E9D8;
    --ui-danger:#874542; --ui-danger-soft:#E8D8D6; --ui-focus:#2859B6;
    --bg:var(--ui-bg); --panel:var(--ui-surface); --ink:var(--ui-text);
    --muted:var(--ui-text-secondary); --hintc:var(--ui-text-secondary);
    --line:var(--ui-border); --line-strong:var(--ui-border-strong);
    --accent:var(--ui-primary); --accent-dk:var(--ui-primary-hover); --accent-soft:var(--ui-primary-soft);
    --gold:#647187; --gold-soft:var(--ui-surface-subtle);
    --blue:var(--ui-primary); --blue-soft:var(--ui-primary-soft);
    --warn:var(--ui-danger); --warn-soft:var(--ui-danger-soft);
    --radius:3px;
    --kred:#2859B6; --kred-dk:#1E478F; --kpink:#DFE6F0; --kline:#BCC6D3;
    --serif:'Noto Serif KR','Nanum Myeongjo',AppleMyungjo,'Batang',serif;
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.7;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word;}
  .wrap{max-width:1880px;margin:0 auto;padding:22px 28px 80px;}

  /* 마스트헤드: 저널의 제호와 발행 정보처럼 보이는 2중 괘선 구조 */
  header.app{padding:13px 0 16px;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);position:relative;margin-bottom:0;}
  header.app::before{content:"교사용 평가 설계 도구  /  성취기준 기반";display:block;margin-bottom:7px;color:var(--ui-primary);font-size:10px;font-weight:800;letter-spacing:.09em;}
  header.app::after{content:"";position:absolute;left:0;right:0;bottom:-4px;border-bottom:1px solid var(--line-strong);}
  header.app h1{margin:0;font-family:var(--serif);font-size:clamp(30px,2.5vw,39px);font-weight:700;line-height:1.28;letter-spacing:-0.045em;}
  header.app p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.6;letter-spacing:.005em;}
  .mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}
  .stamp{display:flex;border:1px solid var(--ink);border-radius:0;overflow:hidden;flex:0 0 auto;background:transparent;}
  .stamp span{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap;}
  .stamp span+span{border-left:1px solid var(--line);}
  .stamp .s1{background:var(--ink);color:var(--ui-paper);}

  /* 비대칭 2단: 좌 문서 미리보기 / 우 설정 도구 */
  .workbench{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(460px,1fr);
    grid-template-areas:"preview tools";gap:24px;align-items:start;margin-top:22px;}
  .workbench.is-empty{grid-template-columns:minmax(360px,.85fr) minmax(520px,1.15fr);}
  .workbench.has-result{grid-template-columns:minmax(0,1.5fr) minmax(460px,1fr);}
  aside.tools{grid-area:tools;min-width:0;background:var(--ui-surface);border:1px solid var(--line);
    border-top:4px solid var(--ink);border-radius:2px;padding:0 24px 14px;}
  main.paperpane{grid-area:preview;min-width:0;position:sticky;top:24px;
    max-height:calc(100vh - 48px);overflow-y:auto;outline:none;background:var(--ui-canvas);
    border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:2px;padding:18px;scrollbar-gutter:stable;}

  /* 문항 생성 방식: 초보자에게 선택지를 처음부터 노출 */
  .run-method{margin:22px 0 0;padding:20px 22px 18px;border:1px solid var(--line);
    border-top:4px solid var(--ink);border-radius:2px;background:var(--panel);box-shadow:none;}
  .run-method-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px;}
  .run-method-kicker{display:block;margin-bottom:4px;color:var(--ui-primary);font-size:10px;font-weight:800;letter-spacing:.15em;}
  .run-method h2{margin:0;font-family:var(--serif);font-size:21px;line-height:1.4;letter-spacing:-.025em;}
  .run-method-intro{margin:3px 0 0;color:var(--hintc);font-size:13px;line-height:1.6;}
  .current-method{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
    border:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--ui-primary);font-size:11px;font-weight:750;letter-spacing:.02em;}
  .current-method::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ui-primary);}
  .method-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .method-option{appearance:none;position:relative;min-height:102px;padding:14px 42px 13px 15px;border:1px solid var(--line);
    border-radius:2px;background:rgba(246,248,251,.58);color:var(--ink);font-family:var(--sans);text-align:left;cursor:pointer;
    transition:border-color .15s,background .15s,box-shadow .15s;}
  .method-option:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .method-option.is-selected{border:1px solid var(--ui-primary);border-top:3px solid var(--ui-primary);padding:12px 42px 13px 15px;background:var(--ui-primary-soft);
    box-shadow:none;}
  .method-option-check{position:absolute;right:13px;top:13px;width:22px;height:22px;border:1px solid var(--line-strong);
    border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;font-weight:900;background:var(--panel);}
  .method-option.is-selected .method-option-check{border-color:var(--ui-primary);background:var(--ui-primary);color:#fff;}
  .method-option strong{display:block;font-family:var(--serif);font-size:16px;line-height:1.45;letter-spacing:-.015em;}
  .method-meta{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--ui-primary);font-size:12px;font-weight:750;}
  .recommended-badge{padding:1px 6px;border-radius:1px;background:var(--ui-primary);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;}
  .method-option small{display:block;margin-top:6px;color:var(--hintc);font-size:13px;line-height:1.55;}
  .method-flow{display:flex;align-items:flex-start;gap:12px;margin-top:12px;padding:9px 0 0;border-top:1px solid var(--line);
    border-radius:0;background:transparent;color:var(--hintc);font-size:12px;line-height:1.6;}
  .method-flow strong{flex:0 0 auto;color:var(--ink);font-size:12px;letter-spacing:.02em;}
  .method-flow span{color:var(--ui-primary);font-weight:650;}
  .envcfg{padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line);}
  .api-config-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .api-config-title{margin:0;font-size:14px;font-weight:750;color:var(--ink);}
  .api-config-toggle{appearance:none;border:0;background:none;padding:5px 0;color:var(--ui-primary);font:650 13px/1.4 var(--sans);cursor:pointer;}
  .api-config-toggle:hover{text-decoration:underline;text-underline-offset:3px;}
  .api-config-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:10px 12px;
    border:1px solid var(--line);border-left:3px solid var(--ui-primary);border-radius:0;background:var(--ui-surface-subtle);}
  .api-config-summary strong{display:block;font-size:13px;line-height:1.45;}
  .api-config-summary span{display:block;margin-top:1px;color:var(--hintc);font-size:12px;line-height:1.45;}

  /* 모바일 탭 · 하단 CTA — 데스크톱에선 숨김 */
  .mtabs{display:none;}
  .mcta{display:none;}
  .work-summary{position:sticky;top:0;z-index:16;display:flex;align-items:center;justify-content:space-between;gap:18px;
    margin-top:18px;padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--ui-primary);
    background:rgba(233,237,242,.96);backdrop-filter:blur(8px);}
  .work-summary-values{display:flex;align-items:center;gap:10px;min-width:0;font-size:12px;color:var(--hintc);}
  .work-summary-values b{color:var(--ink);font-size:13px;}
  .work-summary-values span+span{border-left:1px solid var(--line-strong);padding-left:10px;}
  .step-nav{display:flex;align-items:center;gap:3px;flex:0 0 auto;}
  .step-nav button{appearance:none;border:0;background:transparent;padding:5px 7px;color:var(--hintc);font:650 11px/1.4 var(--sans);cursor:pointer;}
  .step-nav button.is-current{background:var(--ui-primary);color:#fff;}
  .step-nav button.is-done:not(.is-current){color:var(--ui-success);}

  /* 도구 섹션: 카드 박스 대신 수평 괘선 + 여백 */
  .card{background:transparent;border:none;border-radius:0;box-shadow:none;
    padding:24px 0 30px 48px;margin:0;border-top:1px solid var(--line-strong);position:relative;}
  aside.tools > .card:first-child, .card:first-child{border-top:none;}
  .card h2{margin:0 0 18px;padding-bottom:9px;border-bottom:2px solid var(--ink);font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.45;color:var(--ink);
    display:flex;align-items:center;gap:10px;letter-spacing:-.02em;}
  .subh{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.06em;margin:22px 0 9px;padding:0;text-transform:uppercase;}
  .inline-title{display:flex;align-items:center;gap:8px;}
  fieldset.fset{border:none;margin:0;padding:0;min-width:0;}
  fieldset.fset legend{padding:0;display:block;width:100%;}
  .num{position:absolute;left:0;top:29px;color:var(--ui-accent);font-weight:800;font-size:11px;background:none;
    font-variant-numeric:tabular-nums;letter-spacing:.12em;width:auto;height:auto;display:inline;}
  .num::before{content:"0";}
  .num::after{content:" /";color:var(--line-strong);}
  .num.plus::before{content:"";}
  .workflow-step{padding-left:0;padding-bottom:0;scroll-margin-top:64px;}
  .step-toggle{appearance:none;width:100%;min-height:66px;border:0;background:transparent;color:var(--ink);padding:14px 8px 13px 48px;
    display:flex;align-items:flex-start;gap:12px;text-align:left;font-family:var(--sans);cursor:pointer;position:relative;}
  .step-toggle:hover{background:rgba(213,224,242,.45);}
  .workflow-step.is-open .step-toggle{border-bottom:1px solid var(--line);}
  .step-index{position:absolute;left:0;top:18px;color:var(--ui-primary);font-size:11px;font-weight:800;letter-spacing:.12em;}
  .step-toggle>span:last-child{display:block;min-width:0;}
  .step-toggle strong{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;letter-spacing:-.02em;}
  .step-toggle small{display:block;margin-top:3px;color:var(--hintc);font-size:12px;line-height:1.5;font-weight:500;}
  .step-content{padding:20px 0 30px 48px;}
  .step-next{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
  .step-next span{max-width:34em;color:var(--ui-danger);font-size:12px;line-height:1.5;}
  .standards-entry-mode{margin-top:16px!important;padding-top:2px!important;}
  .selected-standards{margin-top:10px;padding:10px 12px;border:1px solid var(--line);background:var(--ui-surface-subtle);}
  .selected-standards-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;}
  .selected-standards-head button,.source-tray-head button{appearance:none;border:0;background:none;color:var(--ui-danger);font:650 11px/1.4 var(--sans);cursor:pointer;}
  .standard-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .standard-chips button{appearance:none;border:1px solid var(--ui-primary);background:var(--ui-primary-soft);color:var(--ui-primary-hover);padding:4px 7px;font:650 11px/1.35 var(--sans);cursor:pointer;}
  .standard-levels{margin-top:8px;border:1px solid var(--line);padding:8px 10px;background:#F1F3F6;}
  .standard-levels summary{cursor:pointer;color:var(--ui-primary);font-size:12px;font-weight:700;}

  label.fld{display:block;font-size:14px;color:var(--ink);margin:0 0 8px;font-weight:600;letter-spacing:0;}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:2px;
    font-family:var(--sans);font-size:16px;line-height:1.5;background:#F2F4F7;color:var(--ink);}
  textarea{min-height:120px;resize:vertical;line-height:1.7;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-focus);box-shadow:0 0 0 3px var(--ui-primary-soft);}
  :focus-visible{outline:2px solid var(--ui-focus);outline-offset:2px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:160px;}

  .pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{appearance:none;min-height:42px;padding:8px 12px;border:1px solid var(--line-strong);
    border-radius:2px;background:#F2F4F7;color:var(--ink);cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:650;line-height:1.45;user-select:none;
    transition:border-color .15s,color .15s,background .15s,box-shadow .15s;}
  .pill:hover:not(.on){border-color:var(--ui-primary);color:var(--ui-primary);background:var(--ui-primary-soft);}
  .pill.on{background:var(--ui-primary);color:#fff;border-color:var(--ui-primary);}
  .pill.on::before{content:"✓ ";font-weight:800;}
  .pill.lv.on{background:var(--ui-primary);border-color:var(--ui-primary);}
  .mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .mode-grid .pill{text-align:left;}
  .level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));}
  .level-grid .pill{width:100%;padding-left:6px;padding-right:6px;}
  .hint{font-size:14px;color:var(--hintc);margin-top:8px;line-height:1.65;max-width:58ch;}
  .hint.compact{margin:-2px 0 8px;}

  /* 출제 패턴 추천·직접 선택 */
  .count-setting{display:flex;align-items:flex-end;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .count-setting .count-input{flex:0 0 112px;}
  .count-setting p{margin:0 0 2px;color:var(--hintc);font-size:13px;line-height:1.6;}
  .pattern-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px;}
  .pattern-heading .subh{margin-bottom:3px;}
  .pattern-heading p{margin:0;color:var(--hintc);font-size:13px;line-height:1.6;max-width:43ch;}
  .pattern-reset{appearance:none;border:none;background:none;color:var(--ui-primary);padding:4px 0;
    font:600 12px/1.45 var(--sans);cursor:pointer;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;}
  .pattern-recommendations{display:grid;gap:8px;margin-top:12px;}
  .pattern-card{width:100%;border:1px solid var(--line);border-left:3px solid var(--line-strong);
    border-radius:1px;background:#F1F3F6;text-align:left;color:var(--ink);font-family:var(--sans);}
  .pattern-card:hover{border-color:var(--ui-primary);border-left-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .pattern-card.is-selected{border-color:var(--ui-primary);border-left-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .pattern-select{appearance:none;width:100%;border:0;background:transparent;padding:13px 14px 8px;text-align:left;color:inherit;font-family:inherit;cursor:pointer;}
  .pattern-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .pattern-rank{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ui-accent);}
  .pattern-selected{font-size:11px;font-weight:800;color:var(--ui-primary);}
  .pattern-card strong{display:block;font-family:var(--serif);font-size:15px;line-height:1.45;letter-spacing:-.015em;}
  .pattern-desc{display:block;margin-top:2px;color:var(--ui-text-secondary);font-size:13px;line-height:1.55;}
  .pattern-flow{display:block;margin-top:8px;color:var(--ui-primary);font-size:12px;font-weight:700;line-height:1.55;}
  .pattern-reason{display:block;margin:0 14px 10px;padding-top:6px;border-top:1px dashed var(--line);color:var(--hintc);font-size:12px;line-height:1.55;}
  .pattern-reason summary{cursor:pointer;color:var(--ui-primary);font-size:11px;font-weight:700;}
  .pattern-reason p{margin:5px 0 0;}
  .pattern-alternative-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);}
  .pattern-alternative-heading strong{font-size:13px;line-height:1.5;}
  .pattern-alternative-heading span{color:var(--hintc);font-size:12px;line-height:1.5;text-align:right;}
  .pattern-alternative-toggle{appearance:none;width:100%;margin:14px 0 8px;padding:11px 12px;border:1px solid var(--line);
    background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-family:var(--sans);cursor:pointer;}
  .pattern-alternative-toggle:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .pattern-alternative-toggle strong{display:block;font-size:13px;}
  .pattern-alternative-toggle small{display:block;margin-top:2px;color:var(--hintc);font-size:11px;line-height:1.45;}
  .pattern-catalog-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 16px;}
  .pattern-catalog-list button{appearance:none;border:1px solid var(--line);border-radius:1px;background:#F1F3F6;
    padding:9px 10px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--sans);}
  .pattern-catalog-list button:hover,.pattern-catalog-list button.is-selected{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .pattern-catalog-list strong{display:block;font-size:13px;}
  .pattern-catalog-list span{display:block;margin-top:2px;color:var(--hintc);font-size:11px;line-height:1.55;}
  .pattern-catalog-list .pattern-card-top{display:flex;margin:0;}
  .pattern-catalog-list .pattern-card-top strong{color:var(--ink);}
  .pattern-catalog-list .pattern-card-top .pattern-selected{color:var(--ui-primary);white-space:nowrap;}
  .pattern-catalog-list em{display:block;margin-top:6px;color:var(--ui-primary);font-size:11px;font-style:normal;font-weight:650;line-height:1.5;}

  /* GRASPS: 기본 3요소 + 선택 요소 */
  .grasps-setting{border:none;margin:18px 0 0;padding:0;min-width:0;}
  .grasps-setting legend{padding:0;}
  .grasps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
  .grasps-chip{position:relative;appearance:none;min-height:82px;border:1px solid var(--line);border-radius:1px;
    background:#F1F3F6;padding:10px 10px 9px 38px;text-align:left;color:var(--ink);font-family:var(--sans);}
  button.grasps-chip{cursor:pointer;}
  button.grasps-chip:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .grasps-chip.is-required{background:var(--ui-surface-subtle);}
  .grasps-chip.is-selected{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .grasps-chip>span{position:absolute;left:10px;top:10px;width:20px;height:20px;border:1px solid var(--ui-primary);
    border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ui-primary);font-size:11px;font-weight:800;}
  .grasps-chip strong{display:block;font-size:13px;line-height:1.35;}
  .grasps-chip small{display:block;margin-top:2px;color:var(--hintc);font-size:11px;line-height:1.45;}
  .grasps-chip em{display:block;margin-top:5px;color:var(--ui-primary);font-size:10px;font-style:normal;font-weight:800;letter-spacing:.03em;}

  .review-doc-status.reviewed{border-color:var(--ui-primary);color:var(--ui-primary);}.review-doc-status.approved{border-color:var(--ui-success);background:var(--ui-success-soft);color:var(--ui-success);}
  .view-switch{display:inline-flex;align-items:stretch;border:1px solid var(--ui-primary);border-radius:2px;overflow:hidden;background:var(--panel);}
  .review-workspace{max-width:860px;margin:0 auto 14px;padding:16px;border:1px solid var(--line-strong);border-top:3px solid var(--ui-primary);background:var(--ui-surface);font-family:var(--sans);}
  .review-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .review-head>div:first-child>span{display:block;color:var(--ui-primary);font-size:10px;font-weight:800;letter-spacing:.1em;}
  .review-head h2{margin:2px 0 0;font-family:var(--serif);font-size:18px;line-height:1.4;}

  .review-status button:disabled{color:#8C95A2;cursor:not-allowed;}

  .review-checks label{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;border:1px solid var(--line);background:#F1F3F6;color:var(--hintc);font-size:12px;line-height:1.45;cursor:pointer;}
  .review-checks label.is-checked{border-color:var(--ui-success);background:var(--ui-success-soft);color:var(--ink);}
  .review-checks input{margin-top:2px;accent-color:var(--ui-success);}
  .review-note{margin:8px 0 0;color:var(--ui-danger);font-size:11px;line-height:1.5;}
  .version-diff{margin:8px 0 0;padding:7px 9px;border-left:3px solid var(--ui-primary);background:var(--ui-primary-soft);color:var(--ink);font-size:11px;line-height:1.5;}

  .section-revise>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .section-revise button{appearance:none;border:1px solid var(--line-strong);background:#F2F4F7;color:var(--ui-primary-hover);min-height:34px;padding:6px 9px;font:650 11px/1.35 var(--sans);cursor:pointer;}
  .section-revise button:hover:not(:disabled){border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .section-revise button:disabled{color:#8C95A2;cursor:not-allowed;}
  .view-switch .view-label{display:flex;align-items:center;padding:0 10px;background:var(--ui-primary-soft);color:var(--ui-text-secondary);font-size:13px;font-weight:700;}
  .view-switch button{appearance:none;min-height:40px;border:0;border-left:1px solid var(--ui-primary);padding:8px 14px;background:transparent;color:var(--ui-text);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;}
  .view-switch button:hover{background:var(--ui-primary-soft);}
  .view-switch button.is-active{background:var(--ui-primary);color:#fff;}
  .view-guide{display:flex;align-items:baseline;gap:8px;margin:-4px 0 14px;padding:9px 12px;border-left:3px solid var(--ui-primary);background:var(--ui-primary-soft);color:var(--ui-text-secondary);font-size:13px;line-height:1.5;}

  .outgrp{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:2px;overflow:hidden;background:var(--panel);}
  .outgrp .og-l{display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:700;

  .badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:13px;font-weight:700;

  .note{background:var(--ui-warning-soft);border:1px solid #D6C5A0;color:#60491F;border-radius:1px;
    padding:12px 14px;font-size:14px;line-height:1.65;margin:10px 0;}

    background:var(--panel);color:var(--hintc);font-weight:600;letter-spacing:.02em;}

  .box{border-radius:4px;padding:12px 14px;margin:10px 0;font-size:14px;border:1px solid var(--line);}

  .err{background:var(--ui-danger-soft);border:1px solid #D4AEAC;color:#7E3C3A;border-radius:1px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.65;}

  /* 인라인 검증 · 설정 요약 · 예시 · 준비 체크리스트 */
  .fielderr{color:var(--ui-danger);font-size:14px;font-weight:600;margin-top:6px;line-height:1.6;}

  .sumline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--hintc);
    margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--ui-surface-subtle);}
  .sumline .sum-warn{color:var(--ui-danger);font-weight:700;}
  .exbox{margin:10px 0;border:1px solid var(--line-strong);border-radius:3px;background:var(--panel);
    padding:10px 12px;font-size:13px;overflow-x:auto;}

  .advtgl{appearance:none;border:1px solid var(--line-strong);border-radius:3px;background:var(--panel);

  .advtgl:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .chevron{font-size:16px;color:var(--ui-primary);}
  .advsum{font-weight:400;font-size:13px;color:var(--hintc);margin-left:auto;text-align:right;}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  .thumb img{width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line-strong);}
  .thumb button{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--panel);background:var(--ui-danger);color:#fff;cursor:pointer;font-size:14px;line-height:1;}
  .upload-btn{display:inline-flex;align-items:center;cursor:pointer;}
  .pdf-thumb{width:auto;}
  .pdf-card{width:132px;height:76px;border:1px solid var(--line);border-radius:4px;display:flex;

  .file-type{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--ui-accent);border:1px solid var(--ui-accent);padding:1px 6px;border-radius:2px;}

  .material-check.is-on{color:var(--ui-primary);font-weight:700;}
  .file-note{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--hintc);max-width:58ch;}

  .optional-badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border:1px solid var(--line-strong);border-radius:3px;
    color:var(--hintc);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0;}

  .actions-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

  .footer-note .copyright a{color:inherit;text-underline-offset:2px;}
  .std-list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:1px;padding:6px;}

    background:#F1F3F6;border:1px solid var(--line);}

  .std-table td{font-size:14px;}
  .source-context{margin-top:8px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--ui-primary);
    background:var(--ui-surface-subtle);color:var(--ink);}
  .source-context>div{display:flex;align-items:center;gap:8px;}
  .source-context>div span{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ui-primary);}
  .source-context>div strong{font-size:13px;}
  .source-context p{margin:4px 0 3px;font-size:13px;line-height:1.55;color:var(--hintc);}
  .source-context small{display:block;font-size:11px;line-height:1.5;color:var(--hintc);}
  .source-results{margin-top:12px;max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:1px;padding:7px;background:var(--ui-surface-subtle);}
  .source-row{position:relative;padding:11px 12px;border-radius:1px;margin-bottom:6px;background:#F1F3F6;border:1px solid var(--line);}
  .source-row:last-child{margin-bottom:0;}

  .source-title-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}

  .source-action-list button:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft);}
  .source-tray{margin-top:10px;border:1px solid var(--ui-primary);background:var(--ui-primary-soft);padding:10px 12px;}

  .history-help{margin:0 0 8px;}

  /* ── 결과 문서: 종이 위의 명조 조판 ───────────────────────── */
  .kdoc{background:var(--ui-paper);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:0;
    padding:48px 52px 56px;max-width:860px;margin:0 auto;position:relative;
    font-family:var(--serif);font-size:14px;line-height:1.8;
    --panel:#F8F6F1;--ink:#202329;--muted:#626A75;--hintc:#555F6C;
    --line:#E2E5E9;--line-strong:#BEC4CD;
    --accent:#2859B6;--accent-dk:#1E478F;--accent-soft:#E1E7F0;}
  .spine{position:absolute;top:44px;right:-1px;writing-mode:vertical-rl;font-family:var(--serif);
    font-size:12px;font-weight:700;letter-spacing:.35em;padding:14px 5px;color:var(--accent-dk);
    border:1px solid var(--line-strong);border-right:none;background:var(--panel);}
  .kdoc button, .kdoc .note{font-family:var(--sans);}
  .keyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.08em;color:var(--hintc);
    font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .keyebrow .chip{background:transparent;color:var(--accent);border:1px solid var(--accent);
    border-radius:3px;padding:1px 8px;font-size:11px;}
  .khead{background:transparent;color:var(--ink);border-radius:0;box-shadow:none;
    font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.4;
    padding:4px 0 14px;border-bottom:2px solid var(--ink);position:relative;}
  .khead::after{content:"";position:absolute;left:0;right:0;bottom:-4px;border-bottom:1px solid var(--ink);}
  .kban{background:transparent;color:var(--accent);border-radius:0;box-shadow:none;
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.02em;
    padding:8px 0 2px;margin:36px 0 12px;border-top:2px solid var(--ink);}
  .kpillrow{display:flex;align-items:center;gap:12px;margin:28px 0 8px;}
  .kpill{background:transparent;color:var(--ink);font-family:var(--sans);
    font-weight:800;font-size:12px;letter-spacing:.08em;border-radius:0;padding:0;white-space:nowrap;}
  .kline{flex:1;border-top:1px solid var(--line-strong);opacity:1;}
  .khd{display:table;color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:800;
    letter-spacing:.04em;margin:34px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--accent);}
  .ksq{font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:.03em;
    margin:18px 0 8px;display:flex;align-items:center;gap:7px;}
  .ksq::before{content:"";width:8px;height:8px;background:var(--accent);display:inline-block;flex:0 0 auto;}

  /* 표: 상하 이중 괘선, 수평선 위주 조판 */
  table.ktbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 18px;
    border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);}
  table.ktbl th{font-family:var(--sans);background:transparent;font-weight:700;font-size:12px;
    letter-spacing:.03em;text-align:center;border:none;border-bottom:1px solid var(--ink);padding:8px 10px;vertical-align:middle;}
  table.ktbl td{border:none;border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;}
  table.ktbl td+td, table.ktbl th+th, table.ktbl th+td, table.ktbl td+th{border-left:1px solid var(--line);}
  table.ktbl tbody th{font-size:12px;}
  table.ktbl td.c{text-align:center;white-space:nowrap;vertical-align:middle;}
  table.ktbl .kel{color:var(--ink);font-family:var(--sans);font-weight:600;font-size:13px;}
  .kchk{color:var(--accent);font-weight:800;text-align:center;vertical-align:middle;}
  .kmat{border:1px solid var(--line-strong);border-radius:0;padding:14px 16px;margin:10px 0;font-size:14px;}
  .kmat .lbl{font-weight:700;}
  .kcite{margin-top:9px;padding-top:7px;border-top:1px solid var(--line);font-family:var(--sans);
    color:var(--hintc);font-size:11px;line-height:1.55;word-break:break-all;}
  .kcite a{color:var(--accent-dk);text-decoration:underline;text-underline-offset:2px;}
  .kintro{font-size:15px;font-weight:700;margin:12px 0 8px;}
  .kq{font-size:15px;font-weight:700;margin:16px 0 6px;line-height:1.7;max-width:38em;}
  .kcond{border:1px solid var(--ink);padding:14px 14px 8px;margin:10px 0 14px;position:relative;border-radius:0;}
  .kcond .t{position:absolute;top:-11px;left:12px;background:var(--panel);padding:0 8px;
    font-family:var(--sans);font-weight:700;font-size:13px;}
  .kcond b.axis{display:block;font-family:var(--sans);font-size:12px;margin:4px 0 2px;letter-spacing:.02em;}
  .kcond ul{margin:2px 0 8px;padding-left:18px;font-size:13px;}
  .kcond li{margin:2px 0;}
  .kcall{background:var(--kpink);border-left:2px solid var(--accent);border-radius:0;
    padding:12px 16px;margin:14px 0;font-family:var(--sans);}
  .kcall .lb{display:inline-block;background:transparent;color:var(--accent);border-radius:0;
    font-size:12px;font-weight:800;letter-spacing:.05em;padding:0;margin-bottom:6px;}
  .kcall ul{margin:0;padding-left:18px;font-size:13px;}
  .kcall li{margin:3px 0;}
  .kdesign{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);margin:10px 0 18px;
    background:#F7FAFB;font-family:var(--sans);font-size:12px;line-height:1.55;break-inside:avoid;}
  .kdesign>div{padding:12px 14px;min-width:0;}
  .kdesign>div+div{border-left:1px solid var(--line);}
  .kdesign-label{margin-bottom:5px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.06em;}
  .kdesign-pattern>strong{display:block;font-size:13px;color:var(--ink);}
  .kdesign-flow{margin:4px 0 8px;color:var(--accent-dk);font-size:11px;font-weight:700;}
  .kdesign dl{margin:0;}
  .kdesign dl>div{display:grid;grid-template-columns:74px 1fr;gap:6px;padding:3px 0;border-top:1px dotted var(--line);}
  .kdesign dt{font-weight:700;color:var(--hintc);}
  .kdesign dd{margin:0;color:var(--ink);}
  .kul{margin:4px 0;padding-left:18px;font-size:13px;}
  .kul li{margin:3px 0;}
  .kstu{border:1px solid var(--line-strong);background:var(--panel);padding:12px 14px;font-size:13px;border-radius:0;margin:8px 0;}
  .kfbbox{background:var(--kpink);border-radius:0;padding:12px 14px;font-size:13px;margin:8px 0;white-space:pre-wrap;}
  .kex{margin-top:8px;padding:6px 0 0;background:transparent;border:none;border-top:1px dashed var(--line-strong);border-radius:0;font-size:12px;}
  .kex b{color:var(--accent);font-family:var(--sans);}
  .kvis{text-align:center;margin:8px 0 2px;}
  .kvis svg{max-width:100%;height:auto;}
  .kvis .cap{font-family:var(--sans);font-size:12px;color:var(--hintc);margin-top:4px;letter-spacing:.02em;}
  .ktotal{font-family:var(--sans);font-size:12px;color:var(--hintc);text-align:right;margin:-10px 0 10px;}
  .kans{border:1px solid var(--line-strong);border-radius:0;padding:4px 12px 10px;margin:6px 0 18px;}
  .kans .kans-t{font-family:var(--sans);font-size:11px;color:var(--muted);margin:4px 0 2px;letter-spacing:.05em;}
  .kans .ln{height:36px;border-bottom:1px dashed var(--line-strong);}
  .kans .ln:last-child{border-bottom:none;}
  .kdoc.editing{outline:2px dashed var(--accent);outline-offset:4px;}
  .edt{outline:1px dashed transparent;border-radius:2px;cursor:text;}
  .kdoc.editing .edt:hover, .kdoc.editing .edt:focus-visible{outline-color:var(--accent);background:var(--accent-soft);}
  .edt-input{display:block;width:100%;min-height:64px;font:inherit;line-height:inherit;
    border:1px solid var(--accent);border-radius:2px;padding:6px 8px;background:#fff;margin:2px 0;}

  /* 빈 상태 · 스켈레톤 */
  .emptydoc{background:var(--ui-paper);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:0;
    min-height:clamp(480px,62vh,640px);max-width:860px;margin:0 auto;padding:0;
    display:flex;flex-direction:column;overflow:hidden;}
  .empty-sheet-head{height:54px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:1fr 92px 92px;align-items:stretch;padding:0 28px;
    font-family:var(--sans);font-size:13px;font-weight:700;color:var(--hintc);letter-spacing:.02em;}
  .empty-sheet-head span{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .empty-sheet-head span:first-child{border-left:none;justify-content:flex-start;}
  .empty-content{width:min(100%,520px);margin:auto;padding:44px 36px;text-align:left;}
  .empty-eyebrow{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--ui-accent);margin-bottom:10px;}
  .empty-title{font-family:var(--serif);font-size:24px;line-height:1.45;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink);}
  .ed-desc{color:var(--hintc);font-size:14px;line-height:1.65;max-width:38em;margin:0 0 24px;}
  .ready-grid{margin:0;border-top:1px solid var(--line-strong);}
  .ready-grid>div{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);}
  .ready-grid dt{font-size:14px;font-weight:600;color:var(--hintc);}
  .ready-grid dd{margin:0;font-size:14px;font-weight:600;color:var(--ink);}
  .ready-grid .ready-ok{color:var(--ui-success);}
  .ready-grid .ready-needed{color:var(--ui-danger);}
  .skeldoc{background:var(--ui-paper);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:0;
    max-width:860px;margin:0 auto;padding:48px 52px;}
  .sk{background:#C9D0D9;border-radius:4px;margin-bottom:12px;animation:skp 1.6s ease-in-out infinite;}
  @keyframes skp{0%,100%{opacity:1}50%{opacity:.55}}
  @media(prefers-reduced-motion:reduce){.sk{animation:none}}
  .skmsg{font-family:var(--sans);font-size:14px;color:var(--hintc);text-align:center;margin:16px 0 0;}

  /* 반응형: ≤1100px 은 탭 전환형 1단 */
  @media(max-width:1100px){
    .workbench,.workbench.is-empty,.workbench.has-result{grid-template-columns:1fr;grid-template-areas:"tools" "preview";}
    .wrap{padding:24px 24px 120px;}
    main.paperpane{position:static;max-height:none;overflow:visible;}
    .mtabs{display:flex;position:sticky;top:0;z-index:30;margin-top:18px;border:1px solid var(--line-strong);border-bottom:2px solid var(--ink);
      background:rgba(213,219,227,.97);backdrop-filter:blur(8px);}
    .mtabs [role=tab]{appearance:none;border:none;background:transparent;font:inherit;
      font-size:14px;font-weight:700;color:var(--hintc);cursor:pointer;flex:1;
      min-height:44px;padding:10px 8px;border-bottom:3px solid transparent;margin-bottom:-2px;}
    .mtabs [role=tab][aria-selected="true"]{color:var(--ui-primary);border-bottom-color:var(--ui-primary);}
    .work-summary{top:47px;display:block;margin-top:8px;}
    .work-summary-values{justify-content:center;flex-wrap:wrap;gap:6px 9px;}
    .step-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:7px;}
    .step-nav button{padding:6px 3px;white-space:nowrap;}
    .workbench{margin-top:12px;}
    .workbench.show-preview aside.tools{display:none;}
    .workbench:not(.show-preview) main.paperpane{display:none;}
    .workbench.show-preview main.paperpane,.workbench:not(.show-preview) aside.tools{animation:panel-in .2s ease-out;}
    .question-block{scroll-margin-top:146px;}
    .workflow-step{scroll-margin-top:146px;}
    .mcta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
      border-top:1px solid var(--line-strong);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
    .mcta .btn{width:100%;min-height:48px;}
    .mcta.result-actions{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px;}
    @keyframes panel-in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  @media(max-width:620px){
    .wrap{padding:16px 20px 120px;}
    header.app h1{font-size:24px;}
    .mast{flex-direction:column;align-items:flex-start;gap:10px;}
    .stamp span{padding:5px 9px;}
    .run-method{margin-top:18px;padding:16px;}
    .run-method-head{display:block;}
    .current-method{margin-top:9px;}
    .method-options{grid-template-columns:1fr;}
    .method-option{min-height:96px;}
    .method-flow{display:block;}
    .method-flow strong{display:block;margin-bottom:2px;}
    .card{padding-left:0;}
    aside.tools{padding:4px 16px 12px;}
    main.paperpane{padding:10px;}
    .num{position:static;margin-right:8px;}
    .mode-grid{grid-template-columns:1fr;}
    .count-setting{align-items:flex-start;}
    .pattern-heading{display:block;}
    .pattern-reset{margin-top:6px;}
    .pattern-alternative-heading{display:block;}
    .pattern-alternative-heading span{display:block;margin-top:2px;text-align:left;}
    .pattern-catalog-list{grid-template-columns:1fr;}
    .grasps-grid{grid-template-columns:1fr;}
    .step-toggle{padding-left:38px;}
    .step-index{left:0;}
    .step-content{padding-left:0;}
    .step-next{align-items:stretch;flex-direction:column-reverse;}
    .step-next .btn{width:100%;}
    .source-title-line{display:block;}
    .relevance{display:inline-flex;margin-top:4px;}
    .preflight ul,.review-checks{grid-template-columns:1fr;}
    .review-head{display:block;}
    .review-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;}
    .review-status button{padding-left:4px;padding-right:4px;}
    .section-revise>span{display:block;margin:2px 0 0;}
    .pill,.btn.sec,.btn.ghost{min-height:44px;}
    .spine{display:none;}
    .outgrp{display:flex;width:100%;grid-column:span 2;}
    .outgrp button{flex:1;}
    .elems{grid-template-columns:1fr;}
    .kdesign{grid-template-columns:1fr;}
    .kdesign>div+div{border-left:none;border-top:1px solid var(--line);}
    .kdoc{padding:20px 16px 28px;}
    .skeldoc{padding:28px 20px;}
    .emptydoc{min-height:520px;}
    .empty-sheet-head{height:46px;grid-template-columns:1fr 64px 64px;padding:0 18px;}
    .empty-content{padding:32px 22px;}
    .empty-title{font-size:21px;}
    .ready-grid>div{grid-template-columns:116px 1fr;gap:12px;}
    .khead{font-size:19px;}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .toolbar .btn{width:100%;}
    .toolbar > span:empty{display:none;}
    .view-switch{grid-column:span 2;width:100%;}
    .view-switch button{flex:1;}
    .view-guide{align-items:flex-start;flex-direction:column;gap:2px;}
    table.ktbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table.ktbl td.c{white-space:normal;}
  }

  /* 인쇄: A4 판형 */
  @page{size:A4;margin:16mm 14mm;}
  @media print{
    body{background:#fff;}
    .noprint{display:none !important;}
    .workbench{display:block !important;margin:0 !important;}
    main.paperpane{position:static !important;max-height:none !important;overflow:visible !important;display:block !important;}
    .mtabs,.mcta,.run-method{display:none !important;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;max-width:none;border:none;border-radius:0;padding:0;margin:0;}
    .kmat,.kans,.kcond,.kcall,.kstu,.kfbbox,.kvis{break-inside:avoid;page-break-inside:avoid;}
    table.ktbl tr{break-inside:avoid;}
    table.ktbl thead{display:table-header-group;}
    .kban,.khd,.ksq{break-after:avoid;}
    .kban,.khead,.kchk,.khd{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.ktbl th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media(prefers-reduced-motion:reduce){
    .workbench.show-preview main.paperpane,.workbench:not(.show-preview) aside.tools{animation:none;}
    *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;}
  }
</style>
</head>

<div id="root">
  <div style="max-width:520px;margin:18vh auto 0;padding:0 24px;font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;color:#606773;text-align:center;">
    <p style="font-size:16px;font-weight:700;color:#181B20;margin:0 0 6px;">논술형 평가 문항 설계</p>
    <p style="font-size:14px;margin:0;">앱을 불러오는 중입니다…</p>
  </div>
</div>
